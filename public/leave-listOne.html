
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>View One Record | Priya Darshini</title>
<link rel="stylesheet" href="/leave-style.css">
</head>
<body class="page-view">
<header class="site-header">
    <a class="brand" href="/leave-home.html">PRIYA DARSHINI<small>LEAVE MANAGEMENT</small></a>
    <nav class="site-nav">
        <a href="/leave-home.html">Home</a>
        <a href="/leave-insert.html">Apply Leave</a>
        <a href="/leave-list.html">List Records</a>
        <a class="active" href="/leave-listOne.html">View One</a>
        <a href="/leave-search.html">Search</a>
        <a href="/leave-update.html">Update</a>
    </nav>
</header>

<section class="hero">
    <div class="hero-content">
        <div class="eyebrow">Employee Services</div>
        <h1>View One Record</h1>
        <p>Enter an Employee ID to view the matching leave record.</p>
    </div>
</section>

<main class="container">
    <section class="panel">
        <h2>Find an Application</h2>
        <form id="viewForm">
            <div class="field">
                <label for="employeeId">Employee ID</label>
                <input id="employeeId" type="number" min="1" required placeholder="Enter Employee ID">
            </div>
            <div class="actions">
                <button type="submit">View Record</button>
            </div>
        </form>
        <div id="message" class="message" role="status"></div>
    </section>

    <section class="panel" id="result" hidden>
        <h2>Record Details</h2>
        <div class="table-container">
            <table>
                <tbody id="detailsBody"></tbody>
            </table>
        </div>
    </section>
</main>

<footer class="site-footer">© 2026 Priya Darshini | Leave Management System</footer>

<script>
const viewForm = document.getElementById("viewForm");
const message = document.getElementById("message");
const result = document.getElementById("result");
const detailsBody = document.getElementById("detailsBody");

viewForm.addEventListener("submit", async event => {
    event.preventDefault();
    result.hidden = true;
    message.className = "message";

    const id = document.getElementById("employeeId").value.trim();

    try {
        const response = await fetch("/leaves/" + encodeURIComponent(id));
        const data = await response.json();

        if (!response.ok) throw new Error(data.message || "Record not found.");

        const record = Array.isArray(data) ? data[0] : data;
        if (!record || !record.EMPLOYEE_ID) throw new Error("No record found for this ID.");

        detailsBody.innerHTML = "";
        const fields = [
            ["Employee ID", "EMPLOYEE_ID"],
            ["Employee Name", "NAME"],
            ["Department", "DEPARTMENT"],
            ["Leave Type", "TYPE_OF_LEAVE"],
            ["Number of Days", "NUMBER_OF_DAYS"],
            ["Description", "DESCRIPTION"]
        ];

        fields.forEach(([label, key]) => {
            const row = document.createElement("tr");
            const heading = document.createElement("th");
            const value = document.createElement("td");
            heading.textContent = label;
            value.textContent = record[key] ?? "";
            row.append(heading, value);
            detailsBody.appendChild(row);
        });

        result.hidden = false;
    } catch (error) {
        message.textContent = error.message;
        message.className = "message show error";
    }
});
</script>
</body>
</html>
